name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.2'
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $dist = "dist/BinaryClock-win64"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "build/Release/BinaryClock.exe" $dist
          windeployqt --release --no-translations "$dist/BinaryClock.exe"
          Compress-Archive -Path "$dist/*" -DestinationPath "BinaryClock-win64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BinaryClock-win64
          path: BinaryClock-win64.zip
          if-no-files-found: error

  linux-appimage:
    name: Linux AppImage (${{ matrix.appimage_arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            appimage_arch: x86_64
            asset_suffix: linux-x86_64
          - runner: ubuntu-24.04-arm
            appimage_arch: aarch64
            asset_suffix: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            libgl1-mesa-dev \
            libfuse2t64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/BinaryClock AppDir/usr/bin/BinaryClock
          cp resources/app.ico AppDir/usr/share/icons/hicolor/256x256/apps/binary-clock.ico
          cat > AppDir/usr/share/applications/binary-clock.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Binary Clock
          Comment=Qt6 binary clock desktop accessory
          Exec=BinaryClock
          Icon=binary-clock
          Categories=Utility;Clock;
          Terminal=false
          EOF

      - name: Download AppImage tools
        run: |
          curl -L -o linuxdeploy.AppImage "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.appimage_arch }}.AppImage"
          curl -L -o linuxdeploy-plugin-qt.AppImage "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${{ matrix.appimage_arch }}.AppImage"
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          QMAKE: /usr/lib/qt6/bin/qmake6
          VERSION: ${{ github.ref_name }}
        run: |
          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage
          appimage="$(find . -maxdepth 1 -name '*.AppImage' ! -name 'linuxdeploy*.AppImage' ! -name 'linuxdeploy-plugin-qt.AppImage' -print -quit)"
          mv "$appimage" "BinaryClock-${{ matrix.asset_suffix }}.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BinaryClock-${{ matrix.asset_suffix }}
          path: BinaryClock-${{ matrix.asset_suffix }}.AppImage
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - windows-x64
      - linux-appimage
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release-assets/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes

